<style>

@font-face{font-family:"DM Sans";src:url(fonts/dmsans.woff2) format("woff2");font-weight:400 700;font-display:swap}
:root{--hd:"Public Sans",system-ui,sans-serif;--bd:"DM Sans",system-ui,sans-serif}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);touch-action:manipulation}
button,a,label,select,input,summary{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.45 var(--bd);-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;padding:0 20px calc(120px + env(safe-area-inset-bottom))}
h1,h2,h3,b,strong{font-family:var(--hd)}
h1{font:800 34px/1.1 var(--hd);margin:6px 0 10px}
h1.hl{font-size:26px;margin:4px 0 14px}
nav.tabs:empty{display:none}
h1 em{font-style:normal;color:var(--pt)}
a{color:inherit;text-decoration:none}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--pt);outline-offset:2px}
small{color:var(--mu);font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 0 10px;min-height:64px}
.logo{display:flex;align-items:center;gap:8px;font:900 24px var(--hd);letter-spacing:.06em;color:var(--pt)}
.logo svg{width:26px;height:26px}
.icbtn{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--s1);border:1px solid var(--ln)}
.icbtn.s{width:40px;height:40px;background:none;border:0}
.dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--pr);border:2px solid var(--bg)}
.dot[hidden]{display:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gruss{display:flex;align-items:center;gap:8px;margin:14px 0 0;font:600 13px var(--bd);letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}

.lead{color:var(--mu);margin:0 0 26px}
.sec{font:800 20px var(--hd);margin:0 0 14px}
.link{color:var(--pt);font-weight:600}
.kat{display:block;position:relative;height:160px;border-radius:22px;overflow:hidden;margin-bottom:12px;color:#fff;isolation:isolate;border:1px solid var(--ln)}
.kat::before{content:"";position:absolute;inset:0;background:var(--bild) center/cover;z-index:-2}
.kat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 25%,rgba(12,8,6,.86));z-index:-1}
.kat.off::before{filter:grayscale(.6) brightness(.6)}
.kat b{position:absolute;left:18px;bottom:40px;font:800 28px var(--hd)}
.kat small{position:absolute;left:18px;bottom:16px;color:#E9E1D9}
.kat .tag{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;font:700 13px var(--bd)}
.kat.on .tag{background:var(--pr);color:var(--on)}
.kat.off .tag{background:rgba(0,0,0,.55);color:#EEE}
.tag svg.i{width:15px;height:15px}
.pill{align-self:flex-start;display:inline-block;padding:3px 9px;border-radius:8px;background:var(--pill);color:var(--pt);font:700 12px var(--bd)}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(440px,calc(100% - 24px));display:flex;gap:4px;padding:6px;border-radius:30px;background:var(--s1);border:1px solid var(--ln);box-shadow:0 8px 30px rgba(0,0,0,.35);z-index:5}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:24px;font-size:12px;font-weight:600;color:var(--pt)}
nav.tabs a[aria-current=page]{background:var(--pill);color:var(--pt)}
.rtop{display:grid;grid-template-columns:44px 1fr 44px;gap:8px}
.rtop h1{font:800 18px var(--hd);margin:0;text-align:center}
.recbar{display:flex;gap:10px;align-items:center;margin:6px 0 16px}
.recsel{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:8px 12px}
.recsel small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.recsel select{appearance:none;background:none;border:0;font:800 17px var(--hd);width:100%;padding:0;text-overflow:ellipsis}
.recsel option{color:#000}
.btn3{display:flex;align-items:center;gap:6px;height:48px;padding:0 14px;border-radius:14px;background:var(--s1);border:1px solid var(--ln);font-weight:600;font-size:14px;white-space:nowrap}
.btn3 svg.i{width:18px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:22px;padding:16px;margin-bottom:16px}
.card h2{font:800 18px var(--hd);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:12px;background:var(--s2);border-radius:16px;margin-bottom:10px}
.lab b{display:block;font-size:15px;line-height:1.2}
.stp{display:flex;align-items:center;gap:6px}
.rb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--s1);border:1px solid var(--ln)}
.rb.p{background:var(--pr);color:var(--on);border-color:transparent}
.val{display:flex;flex-direction:column;align-items:center;width:78px}
.val input{width:100%;text-align:center;background:none;border:0;padding:0;font:800 26px/1.1 var(--hd)}
.val small{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--s2);margin:16px 0 12px}
.seg button{flex:1;height:46px;border-radius:12px;font-weight:700}
.seg button.on{background:var(--pr);color:var(--on)}
.hefe{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;border:1px solid var(--pr);background:var(--pill)}
.hefe b{font-size:16px}.hefe b span{color:var(--pt);margin-left:6px}
.hefe small{display:block}
.hefe input{width:90px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--s1);padding:0 10px;font:700 18px var(--hd);text-align:center}
.ges{padding:4px 10px;border-radius:10px;border:1px solid var(--pr);color:var(--pt);font:700 13px var(--bd)}
.zut{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--ln)}
.zut:last-child{border-bottom:0}
.zut .d{width:10px;height:10px;border-radius:50%}
.zut b{font-size:16px;display:block}
.zut .gr{font-size:14px;color:var(--mu)}
.zut .gr strong{font-size:24px;color:var(--tx)}
.acc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:800 18px var(--hd)}
.acc .cnt{margin-left:auto;color:var(--mu);font:600 13px var(--bd);white-space:nowrap}
.schr{margin:12px 0 0;padding:0;list-style:none;counter-reset:s}
.schr li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 12px;margin-bottom:8px;background:var(--s2);border-radius:14px;font-size:15px}
.schr li::before{content:counter(s);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pill);color:var(--pt);font:800 13px var(--hd)}
.schr-leer{color:var(--mu);margin:12px 0 4px}
textarea{width:100%;min-height:150px;margin-top:12px;padding:12px;border-radius:14px;border:1px solid var(--ln);background:var(--s2);resize:vertical;line-height:1.45}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:18px;background:var(--pr);color:var(--on);font:800 17px var(--hd)}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;margin-top:10px;border-radius:18px;border:1px solid var(--ln);background:var(--s1);font:700 16px var(--hd)}
.titel{display:flex;justify-content:space-between;align-items:flex-end;margin:10px 0 16px}
.titel h1{margin:0}
.fab{width:56px;height:56px;border-radius:50%;background:var(--pr);color:var(--on);display:grid;place-items:center}
.rez{display:flex;align-items:center;gap:4px;background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:10px 6px 10px 10px;margin-bottom:12px}
.rez .main{flex:1;min-width:0;display:flex;gap:14px;align-items:center;text-align:left}
.rez img{width:76px;height:76px;border-radius:14px;object-fit:cover;flex:none}
.rez .main>span{display:flex;flex-direction:column;gap:3px;min-width:0}
.rez b{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sich{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sich p{grid-column:1/-1;margin:0;color:var(--mu)}
.sich h2{grid-column:1/-1;margin:0;justify-content:flex-start;gap:8px}
.sich button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:6px 10px;border-radius:14px;background:var(--s2);font-weight:600;text-align:center;font-size:14px}
.sich svg.i{width:18px;flex:none}
.zrow{display:flex;align-items:center;gap:12px;padding:10px 4px}
.zrow+.zrow{border-top:1px solid var(--ln)}
.zrow .ico{width:44px;height:44px;border-radius:12px;background:var(--pill);color:var(--pt);display:grid;place-items:center;flex:none}
.zrow select,.zrow input{width:100%;min-width:0;background:none;border:0;font:800 17px var(--hd);padding:0;appearance:none;text-overflow:ellipsis}
.zrow small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.zrow option{color:#000}
.tl{list-style:none;margin:20px 0 14px;padding:0}
.st{display:grid;grid-template-columns:84px 24px 1fr;gap:6px;margin-bottom:14px}
.st .t{align-self:start;text-align:center;padding:6px 4px;border-radius:12px;background:var(--s1);border:1px solid var(--ln);font:800 14px/1.2 var(--hd);white-space:nowrap}
.st .t small{display:block;font-weight:600;font-size:11px}
.st .l{position:relative}
.st .l::before{content:"";position:absolute;left:11px;top:-16px;bottom:-16px;width:2px;background:var(--ln2)}
.st:first-child .l::before{top:16px}
.st:last-child .l::before{bottom:auto;height:16px}
.st .l::after{content:"";position:absolute;left:5px;top:10px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--pr)}
.st .c{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:12px 14px}
.st .c b{display:block;font-size:17px}
.st .c small{display:block;margin-top:2px;font-size:13px}
.st.end .t{background:var(--pr);color:var(--on);border-color:transparent}
.st.end .l::after{background:var(--pr)}
.st.end .c{border-color:var(--pr)}
.kb{display:grid;grid-template-columns:84px 24px 1fr;margin:-6px 0 8px}
.kb span{grid-column:3;justify-self:start;display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:16px;border:1px solid var(--wasser);color:var(--wasser);font:700 13px var(--bd)}
.kb svg.i{width:15px}
.kb::before{content:"";grid-column:2;width:2px;height:100%;margin-left:11px;background:var(--wasser)}
.hinweis{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--s1);border:1px solid var(--ln);color:var(--mu);font-size:14px}
.warn{color:var(--pt);font-weight:600}
dialog{border:1px solid var(--ln);border-radius:22px;background:var(--s1);color:var(--tx);padding:20px;width:min(380px,calc(100% - 32px))}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 6px;font:800 20px var(--hd)}
dialog p{margin:0 0 12px;color:var(--mu)}
dialog input[type=text]{width:100%;height:48px;border-radius:12px;border:1px solid var(--ln);background:var(--s2);padding:0 12px;margin-bottom:12px}
dialog input[hidden]{display:none}
.dbtn{display:flex;flex-direction:row-reverse;gap:10px}
.dbtn button{flex:1;height:50px;border-radius:14px;font:800 16px var(--hd);border:1px solid var(--ln);background:var(--s2)}
.dbtn button[value=ok],.dbtn button.pri{background:var(--pr);color:var(--on);border-color:transparent}
#mn form{display:flex;flex-direction:column;gap:8px}
#mn button{height:52px;border-radius:14px;background:var(--s2);font:700 16px var(--hd)}
#mn button.gef{color:var(--pt)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translate(-50%,20px);opacity:0;transition:.25s;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:600;z-index:9;pointer-events:none;max-width:calc(100% - 40px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.ph{display:grid;place-items:center;background:var(--pill);color:var(--pt)}
.kcat,.kzl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--s1);border:1px solid var(--ln)}
.kcat{padding:18px 16px;margin-bottom:10px;border-radius:18px}
.kcat b{flex:1;font-size:18px}
.kcat.leer{opacity:.55}
.kzl{min-height:56px;padding:0 14px;margin-bottom:8px;border-radius:14px}
.kzl b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.kzl i{display:flex;color:var(--pt)}
.lnk b{color:var(--pt)}
.wart{opacity:.7}.wart small{color:var(--mu);font-size:13px}
.kcat svg.i,.kzl svg.i{flex:none;color:var(--mu);transform:rotate(-90deg)}
.kzl i svg.i{width:16px;height:16px;color:var(--pt);transform:none}
.hero{border-radius:22px;overflow:hidden;margin:4px 0 12px;aspect-ratio:16/9;background:var(--s1);border:1px solid var(--ln)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .ph{width:100%;height:100%}
.hero .ph svg.i{width:64px;height:64px}
.hero.kl{aspect-ratio:16/9;margin:0 0 10px}
.ktz{display:flex;align-items:center;gap:12px;margin:4px 0 12px}
.kt{flex:1;min-width:0;margin:0;font-size:22px;line-height:1.2;overflow-wrap:anywhere}
.vid{flex:none;color:var(--pt)}
.kz{list-style:none;margin:0;padding:0}
.kz li{padding:7px 4px;border-bottom:1px solid var(--ln)}
.kz li:last-child{border:0}
.kz .kh{border:0;padding:14px 4px 4px;font:800 13px var(--hd);letter-spacing:.06em;text-transform:uppercase;color:var(--pt)}
.kz .kh:first-child{padding-top:0}
.kbs{margin:0;white-space:pre-line}
.btn2.gef{color:var(--pt)}
.sec.kk{margin:22px 0 12px;display:flex;align-items:baseline;gap:8px}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;margin-bottom:6px;font:700 12px var(--bd);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.fld input,.fld select{width:100%;height:48px;border-radius:12px;border:1px solid var(--ln);background:var(--s2);padding:0 12px}
.fld textarea{margin-top:0}
.fld option{color:#000}
.bb{display:flex;gap:10px}
.bb button{flex:1;height:46px;border-radius:14px;background:var(--s2);font-weight:600}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

 +'<section class="card zeit"><label class="zrow"><span class="ico">'+ic('slice')+'</span><span style="flex:1;min-width:0"><small>Rezept</small><select id="zSel">'+S.rezepte.map(r=>'<option value="'+esc(r.id)+'"'+(r.id===S.aktiv?' selected':'')+'>'+esc(r.name)+' · '+nfm(1).format(kuehl(r.id===S.aktiv?e:r))+' h Kühlschrank</option>').join('')+'</select></span></label>'
 +'<label class="zrow"><span class="ico">'+ic('clock')+'</span><span style="flex:1;min-width:0"><small>Gebacken wird am</small><input type="datetime-local" id="bz" value="'+esc(S.backzeit)+'"></span></label></section>'
 +'<ul class="tl" id="tl" style="padding:0">'+tlHtml()+'</ul>'
 +'<div class="hinweis">'+ic('info')+'<span>Die Zeiten rechnen sich neu, sobald du Backzeit oder Rezept änderst.</span></div>'}

const VITELLO={id:'vitello',name:'Vitello Tonnato',kat:'Vorspeise',bild:'',video:'https://www.instagram.com/p/DdZW3dwtHdz/',geaendertAm:0,
zutaten:['Fleisch:','Kalbsrücken, Semmerrolle (Schwanzstück) oder Oberschale','Salz','Thymian und Rosmarin','Butter','Olivenöl','','Sauce:','1 Eigelb','130 g Thunfisch aus der Dose','1 TL Senf','200 ml neutrales Öl (Raps- oder Sonnenblumenöl)','2 EL Kapern mit Kapernwasser','4–5 Sardellenfilets (im Video 2–3)','Frisch gemahlener Pfeffer','Zitronenabrieb','½ TL Zucker','Ein paar Tropfen Knoblauchöl','','Anrichten:','Zitronenabrieb und Olivenöl','Staudensellerie mit Blättern','Kapernäpfel und Kapern','Frisch gemahlener Pfeffer'].join('\n'),
text:['1. Silberhaut vom Fleisch abziehen und das Fleisch rundum salzen.','2. Reichlich Öl in der Pfanne erhitzen und das Fleisch von allen Seiten kräftig anbraten.','3. Kräuter mit etwas Butter verkneten und oben auf das Fleisch legen, damit sie langsam einziehen. Das Fleisch dabei auf ein Gitter über ein Blech setzen.','4. Bei ganz niedriger Temperatur in den Ofen schieben, bis die Kerntemperatur etwa 56 °C erreicht. Herausnehmen und abkühlen lassen.','5. Sauce: Thunfisch, Sardellen, Senf, Kapern, Eigelb und Pfeffer in den Mixer geben. Neutrales Öl nach und nach einlaufen lassen.','6. Mit Zitronenabrieb, Zucker und Knoblauchöl abschmecken und noch einmal mixen.','7. Das abgekühlte Fleisch in ganz dünne Scheiben schneiden.','8. Reichlich Sauce auf den Teller, die Scheiben darauf. Mit Kapern, Sellerie, Kapernäpfeln, Sellerieblättern, Zitronenabrieb, Olivenöl und Pfeffer anrichten.','','Hinweis: Im Video steht weder eine Ofentemperatur noch eine Fleischmenge.','Quelle: Tim Armann (Instagram)'].join('\n')};
const GANS={id:'gans',name:'Gänsebraten mit Sauce',kat:'Hauptspeise',bild:'',video:'https://www.instagram.com/p/DSSZ7gBCpW_/',geaendertAm:0,
zutaten:['Gans und Füllung:','ca. 4,5 kg Gans (TK)','1 Apfel','1 Orange','2 weiße Zwiebeln','4 Zweige Beifuß','4 Wacholderbeeren','4 Pimentkörner','Salz für das Salzwasser','Sauce:','1 Stück Gänsefett','Innereien der Gans','1 Karotte','50 g Sellerie','1 Zwiebel','½ Stange Lauch','1 EL Tomatenmark','200 ml Rotwein (plus ein Schluck)','1 EL Mehl (Type 405)','1,5 l Wasser','8 Pimentkörner','8 Wacholderbeeren','4 Zweige Beifuß','Mondamin (Speisestärke) zum Binden','Salz und Pfeffer'].join('\n'),
text:['1. 24 Std. vorher die gefrorene Gans zum Auftauen in Salzwasser legen.','2. Innereien herausnehmen und für die Sauce beiseitelegen. Das Fett im Inneren lösen und den Bürzel abschneiden.','3. Apfel, Orange, Zwiebeln, Wacholder, Piment und Beifuß in die Gans füllen (der Beifuß macht das Fett bekömmlicher). Zutackern oder zubinden.','4. Gans auf ein Gitter legen, darunter ein Blech. Bei 140 °C Umluft 3 Std. in den Ofen.','5. Sauce, während die Gans gart: Innereien klein hacken und mit einer Flocke Gänsefett im Topf anrösten. Wurzelgemüse dazugeben und etwa 10 Min. rösten.','6. Tomatenmark und Mehl dazu, 1 Min. rösten, mit Rotwein ablöschen. Einkochen lassen und noch einen Schluck Rotwein dazugeben.','7. Wasser, Piment, Wacholder und Beifuß dazugeben und 2 bis 2,5 Std. bei kleiner Flamme einkochen.','8. Nach 3 Std. hat sich das Fett der Gans im Blech gesammelt. Durch ein Sieb in eine Schüssel gießen und kalt stellen, nicht wegschütten: zum Braten ist es sehr gut.','9. Das Blech sauber spülen. Es darf kein Fett mehr darauf sein, sonst qualmt der Ofen.','10. Die Gans 3 bis 5 Min. unter den Grill schieben.','11. Die Sauce durch ein Sieb gießen, mit Speisestärke binden und mit Salz und Pfeffer abschmecken.','','Hinweis: Im Video fehlen die Salzmenge für das Salzwasser, die Grill-Einstellung, die Kerntemperatur und die Ruhezeit.','Quelle: FOODBOOM (Hannes), Instagram'].join('\n')};
const MAYO={id:'mayo',name:'Light-Mayonnaise',kat:'Soßen',bild:'',video:'https://www.instagram.com/p/C7zY7ZkMN27/',geaendertAm:0,

text:['1. Alle Zutaten in einen Mixer geben, die Eier zuerst.','2. Alles cremig mixen, fertig.','','Passt als Dip, in den Salat oder zum Grillen.','','Nährwerte laut Beschreibung (250 g ohne Proteinpulver): 426 kcal, 35 g Fett, 0,2 g Kohlenhydrate, 19 g Eiweiß. Pro 100 g: 170 kcal, 14 g Fett, 0,08 g Kohlenhydrate, 7,6 g Eiweiß.','Quelle: Sabrina Mirella Börke (Instagram)'].join('\n')};
const CHIA={id:'chia',name:'Schoko-Chia-Pudding',kat:'Dessert',bild:'',video:'https://www.instagram.com/p/Demc_rZt5dD/',geaendertAm:0,
zutaten:['Für 2 Portionen:','240 g griechischer Joghurt (2 % Fett)','240 ml Mandelmilch, ungesüßt','45 g Chiasamen','2 EL Backkakao, ungesüßt (ca. 10 g)','1,5 EL Ahornsirup (oder nach Geschmack)','1 TL Vanilleextrakt'].join('\n'),

const TALER={id:'taler',name:'Kartoffel-Taler',kat:'Beilage',bild:'',video:'https://www.instagram.com/p/DdRkFohId1Q/',geaendertAm:0,
zutaten:['400 g gekochte Kartoffeln','15 g Speisestärke (im Video 2 EL)','200 g Cottage Cheese','45 g Light-Pizzakäse, gerieben','Salz, Pfeffer und Knoblauch','','Dip:','Cottage Cheese','Topfen','Schnittlauch','Salz'].join('\n'),
text:['1. Die gekochten Kartoffeln mit Kartoffelpresse oder Gabel zerdrücken.','2. Cottage Cheese, geriebenen Käse und Speisestärke dazugeben, mit Salz, Pfeffer und Knoblauch würzen und alles verkneten.','3. Aus dem Teig mit den Händen flache Taler formen.','4. Die Taler in einer beschichteten Pfanne von beiden Seiten braten. Alternativ im Ofen backen.','5. Dip: Cottage Cheese, Topfen, Schnittlauch und Salz verrühren.','','Ergibt 14 Stück, dauert etwa 15 Minuten. Pro Stück laut Beschreibung: 42 kcal, 3 g Eiweiß, 1,7 g Fett, 7,8 g Kohlenhydrate.','Hinweis: Weder Bratdauer noch Temperatur (Pfanne oder Ofen) werden genannt. Die Dip-Mengen fehlen.','Quelle: TheSmartCooking (Instagram)'].join('\n')};
const BUTTER={id:'butter',name:'Butterschnitzel mit Erdäpfelpüree',kat:'Hauptspeise',bild:'',video:'https://www.instagram.com/p/DN7-jDUCLOs/',geaendertAm:0,
zutaten:['Erdäpfelpüree:','Erdäpfel (am Vortag gekocht)','Milch','Butter','Salz','Muskat','','Butterschnitzel:','Faschiertes','Altes Brot','Schlagobers','Petersilie','1 Ei','Salz und Pfeffer','Muskat','Prosciutto, knusprig gebraten','Butter zum Braten','','Sauce:','Bratenrückstand aus der Pfanne','Schalotten','Knoblauch','Trockener Weißwein','Miso-Paste','Schlagobers','Salbeiblätter','Salz und Pfeffer'].join('\n'),
text:['1. Püree: Die Erdäpfel schon am Vortag kochen. Durch die Erdäpfelpresse drücken, Milch und Butter einrühren und mit Salz und Muskat abschmecken. Es soll richtig cremig sein.','2. Butterschnitzel: Faschiertes in eine Schüssel geben. Altes Brot fein hacken und mit Schlagobers, Petersilie, Ei, Salz, Pfeffer und Muskat dazugeben. Alles gut durchkneten.','3. Laibchen formen, auf ein Blech legen und im Kühlschrank ziehen lassen.','4. Den Prosciutto in der Pfanne knusprig braten und zur Seite stellen. Er kommt später auf den Teller.','5. Butter in der Pfanne schaumig werden lassen und die Laibchen darin langsam und gemütlich braten. Herausnehmen und warm halten.','6. Sauce: Im Bratenrückstand Schalotten und Knoblauch kurz anschwitzen. Mit trockenem Weißwein ablöschen und gut einreduzieren.','7. Miso-Paste, Schlagobers, Salz und Pfeffer dazugeben, Salbei einlegen und so lange köcheln, bis die Sauce cremig ist. Zum Schluss mit Pfeffer abschmecken.','8. Anrichten: Püree, Butterschnitzel, Sauce und Prosciutto auf den Teller.','','Hinweis: Im Video werden keine Mengen, Garzeiten oder Temperaturen genannt, und ein Satz am Ende (zur Sauce) ist im Ton unverständlich.','Quelle: Gerhard Dragschitz, motioncooking (Instagram)'].join('\n')};
const COTTAGE={id:'cottage',name:'Cottage-Cheese-Kuchen',kat:'Dessert',bild:'',video:'https://www.instagram.com/reel/DeZldAzC0xM/',geaendertAm:0,
zutaten:['1 Becher Cottage Cheese (ganz)','2 EL griechischer Joghurt','2 Scoops Proteinpulver, Geschmack Vanille','1 EL geriebene Mandeln','2 Eier','1 EL Backkakao'].join('\n'),
text:['1. Cottage Cheese, Eier, Kakao, Joghurt, Mandeln und Proteinpulver in den Mixer geben.','2. Alles gründlich zu einer glatten Masse mixen.','3. In eine Form füllen und etwa 40 Minuten bei Ober- und Unterhitze backen, bis der Kuchen fest ist.','','Makros laut Beschreibung (ganzer Kuchen, ca.): 500 kcal, 44 g Eiweiß, 21 g Kohlenhydrate, 26 g Fett.','','Hinweis: Die Ofentemperatur, die Becher-Größe und die Form werden nicht genannt. Im Video kommt noch ein Süßungsmittel dazu (Honig, im Original Ahornsirup) und etwas Vanille, Menge nicht genannt.','Quelle: Alex Raww (Instagram), Original laut Beschreibung: @thechefoutwest'].join('\n')};
const BROWNIE={id:'brownie',name:'Protein-Brownie',kat:'Fitness-Süßes',bild:'',video:'https://www.instagram.com/reel/Dd6xjq6oqvD/',geaendertAm:0,

text:['1. Kidneybohnen gründlich abspülen und gut abtropfen lassen.','2. Mit Schoko-Whey, Backkakao, Eiern, Milch, Backpulver und etwas Süße in den Mixer geben und mixen, bis eine glatte, cremige Masse entsteht.','3. Den Teig in eine kleine Backform geben und bei 180 °C Umluft etwa 20–25 Minuten backen. Für einen saftigeren Brownie früher aus dem Ofen nehmen, danach kurz abkühlen lassen.','','Nährwerte für den ganzen Brownie laut Beschreibung (ca.): 570 kcal, 57 g Eiweiß, 40–45 g Kohlenhydrate, 15–17 g Fett, 20–21 g Ballaststoffe.','Quelle: Azad (Instagram)'].join('\n')};
const PKUCHEN={id:'pkuchen',name:'Protein-Kuchen',kat:'Fitness-Süßes',bild:'',video:'https://www.instagram.com/reel/DWvdq1DCjpF/',geaendertAm:0,
zutaten:['Für 2 Portionen:','250 g Skyr oder Magerquark','50 g Grieß','1 Ei','5 g Backpulver','1–2 Scoops Proteinpulver, Geschmack Vanille','Puderzucker zum Bestäuben'].join('\n'),
text:['1. Backofen auf 160 °C Umluft vorheizen.','2. Alle Zutaten in einer kleinen Auflaufform gut verrühren.','3. Im vorgeheizten Ofen etwa 25–30 Minuten backen.','4. Kurz abkühlen lassen, anschneiden und mit Puderzucker bestäuben.','','Nährwerte pro Portion laut Beschreibung: 215 kcal, 20 g Eiweiß, 24 g Kohlenhydrate, 3 g Fett.','Quelle: Jaqueline Blanc (Instagram)'].join('\n')};

const NOTIZEN=[
sn('bbq','BBQ-Sauce','Soßen',['1 Tasse Ketchup','¼ Tasse Apfelessig','¼ Tasse Honig','¼ Tasse brauner Zucker','1 TL Worcestershiresauce','1 TL Senf','½ TL geräuchertes Paprikapulver','½ TL Knoblauchpulver','½ TL Zwiebelpulver','Salz und Pfeffer nach Geschmack'],['1. Alle Zutaten in einem mittelgroßen Topf gut vermengen.','2. Bei mittlerer Hitze zum Kochen bringen, dabei ständig rühren, damit nichts anbrennt.','3. Hitze reduzieren und 15–20 Minuten köcheln lassen, bis die Sauce etwas eindickt.','4. Mit Salz und Pfeffer abschmecken.','5. Vom Herd nehmen und abkühlen lassen. Beim Abkühlen wird sie noch dicker.','','Im luftdichten Behälter im Kühlschrank bis zu 2 Wochen haltbar. Passt zum Marinieren von Fleisch, als Dip oder zum Verfeinern von Grillgerichten.']),
sn('biersauce','Biersauce','Soßen',['Für 250 ml:','100 g Bio-Zwiebel','30 g Bio-Bergbauern-Butter','125 ml Bier','2 Zweige Thymian','1 Zweig Rosmarin','2 TL Blüten-/Waldhonig','430 ml BBQ-Sauce'],['1. Zwiebel schälen und in feine Streifen schneiden.','2. In Butter anschwitzen.','3. Mit Bier ablöschen und die Zwiebel darin weich kochen.','4. Thymian und Rosmarin fein hacken.','5. Kräuter und Honig zum Zwiebelsud geben.','6. Mit der BBQ-Sauce auffüllen.','7. Noch einmal gut aufkochen lassen und mit dem Stabmixer pürieren.','8. Sauce gut abkühlen lassen und im Kühlschrank aufbewahren.','','Zubereitung 25 Min., Kochzeit 20 Min., gesamt 45 Min.','Quelle: Hofer-Rezept (Screenshot)']),
sn('bigmac','Big Mac Soße','Soßen',['Variante 1:','200 g Mayonnaise','2 Essiggurken oder 2 EL Relish','¼ Zwiebel, gerieben','2 TL Zwiebelpulver','1 TL Knoblauchpulver','2 TL Paprikapulver','2 TL Weißweinessig','1 TL Senf','Salz','Pfeffer','','Variante 2:','200 g Mayonnaise','2 EL Ketchup','2 TL Senf (mild oder mittelscharf)','2 EL Gewürzgurkensud','2 Gewürzgurken, fein gehackt','1 kleine Zwiebel, fein gehackt','1 TL Paprikapulver (edelsüß)','1 TL Knoblauchpulver','1 TL Zwiebelpulver','½ TL Weißweinessig (optional)','Salz und Pfeffer nach Geschmack'],['Variante 2:','1. Mayonnaise, Ketchup, Senf und Gewürzgurkensud in einer Schüssel glatt rühren.','2. Fein gehackte Gewürzgurken und Zwiebel unterheben.','3. Mit Paprika-, Knoblauch- und Zwiebelpulver, Salz und Pfeffer würzen. Für einen leicht säuerlichen Geschmack den Weißweinessig dazugeben.','4. Im Kühlschrank mindestens 1 Stunde ziehen lassen, damit sich die Aromen entfalten.','','Hinweis: Zu Variante 1 steht keine Zubereitung im Screenshot, vermutlich einfach alles verrühren und ziehen lassen.','Quelle Variante 1: Fabi und Phil (Facebook)']),
sn('braunesauce','Braune Sauce','Soßen',['Für 4 Portionen:','2 EL Butter','2 EL Mehl','500 ml Rinderbrühe','1 Zwiebel','1 Karotte','1 Stange Sellerie','1 EL Tomatenmark','1 TL Zucker','1 TL Worcestersauce','Salz und Pfeffer nach Geschmack'],['1. Zwiebel, Karotte und Sellerie fein würfeln. Butter im Topf erhitzen und das Gemüse darin anschwitzen.','2. Tomatenmark hinzufügen und kurz mitrösten.','3. Mehl einstreuen und unter ständigem Rühren goldbraun anschwitzen.','4. Nach und nach die Rinderbrühe dazugeben und gut verrühren, damit keine Klumpen entstehen. Zum Kochen bringen und 15–20 Minuten köcheln lassen.','5. Zucker und Worcestersauce dazugeben, mit Salz und Pfeffer abschmecken.']),
sn('chilisauce','Chinesische Chili-Sauce','Soßen',['60 g getrocknete rote Chilis (Sichuan- oder Thai-Chilis)','60 ml Pflanzenöl (oder Sesamöl)','2 EL Sichuan-Pfefferkörner (optional)','3 Knoblauchzehen, fein gehackt','1 TL Ingwer, fein gehackt','2 EL Sojasauce','1 EL Reisessig','1 EL Zucker (oder Honig)','½ TL Salz','1 EL Sesamsamen (optional)','1 EL fermentierte schwarze Bohnen (optional)'],['1. Chilis entstielen und grob hacken.','2. Chilis und Sichuan-Pfefferkörner in einer trockenen Pfanne bei niedriger Hitze rösten, bis sie duften (ca. 1 Minute).','3. Im Mörser oder in der Gewürzmühle zu groben Flocken mahlen.','4. Öl in einer Pfanne auf niedriger Stufe erhitzen, Knoblauch und Ingwer anbraten, bis sie duften.','5. Chiliflocken dazugeben und 30 Sekunden unter Rühren anbraten (nicht verbrennen lassen).','6. Sojasauce, Essig, Zucker und Salz unterrühren. Optional die schwarzen Bohnen dazugeben.','7. Vom Herd nehmen, Sesam einrühren und abkühlen lassen.','8. In ein Glas füllen und kühl lagern.','','Perfekt als Dip für Dumplings, zu Nudeln und Wok-Gerichten.']),
sn('honigsenf','Honig-Senf-Dressing','Soßen',['375 ml weißer Balsamico','100 g Zucker','100 g Honig','45 g Salz','150 g mittelscharfer Senf','1 Liter Sonnenblumenöl','300 ml Wasser'],['1. Alle Zutaten in einen Mixbecher geben und fein pürieren.','2. In Flaschen füllen und im Kühlschrank aufbewahren.','','Sehr ergiebig, daher sparsam dosieren. Haltbar bis zu 4 Wochen im Kühlschrank.','Quelle: Hofladen Röll, Vroni (Facebook)']),
sn('knoblauchpaste','Knoblauchpaste','Soßen',['Feste Paste:','400 g Knoblauch','150 g Salz','100 g Rapsöl oder Sonnenblumenöl','','Flüssige Variante:','100 g Knoblauch','150 g Sonnenblumenöl','1 Spritzer Zitronensaft','50 g Salz'],['Thermomix-Angaben.','','Feste Paste: Alles 20–30 Sek. auf Stufe 10. Bei Bedarf ein 2. Durchgang. Im Glas mit Öl bedecken.','','Flüssige Variante: Knoblauch 5 Sek. auf Stufe 8, danach den Rest 1 Min. auf Stufe 7.','','Hinweis: Die Salzmenge der flüssigen Variante ist in der Handschrift von 120 g auf 50 g korrigiert.']),
sn('marinadehaehnchen','Marinade Hähnchen','Soßen',['1 EL Honig','3 EL Olivenöl','3 EL Sojasauce','3 EL Weißwein, halbtrocken','1 EL Balsamico','1 EL Zitronen- oder Limettensaft','1 TL Senf, gehäuft','2 TL Tomatenmark','2 Knoblauchzehen, gepresst','1 TL Rosmarin, gehäuft','1 TL Oregano, gehäuft','½ TL Zimt','1 TL Salz','1 TL Pfeffer','1 TL Paprikapulver, edelsüß','2 getrocknete Chilischoten'],['1. Alle Zutaten, falls nötig zerkleinert, nach und nach zusammenfügen und gut vermengen. Getrocknete Kräuter und Chilis am besten im Mörser zermahlen.','2. Die Mengen lassen sich nach Geschmack variieren, wichtig ist nur, dass eine dickflüssige Marinade entsteht.','3. Reicht für 800 g Hähnchenbrustfilet oder Schweinesteaks (Nacken oder Filet). Das Fleisch rundum einpinseln und mindestens 2 Stunden ruhen lassen, optimal über Nacht.']),
sn('marinadeerdaepfel','Marinade Erdäpfelsalat','Soßen',['Für 4 Portionen (ca. 1 kg Kartoffeln):','150 ml warme, klare Suppe (Rind oder Gemüse)','1 Zwiebel','1 Prise Salz','1 TL Zucker','1 Prise schwarzer Pfeffer','80 ml Sonnenblumen- oder Rapsöl','50 ml Weißweinessig (oder Apfelessig)','1 TL Senf (mittelscharf oder Dijon)'],['1. Suppe aufkochen. Zwiebel in Würfel, Ringe oder Streifen schneiden.','2. Heiße Suppe mit Zucker, Salz und Pfeffer würzen, Zwiebel dazugeben, 2–3 Minuten köcheln lassen und vom Herd nehmen.','3. Essig, Öl und Senf verrühren und in die noch warme Suppe einrühren.','4. Über die noch warmen, bissfest gekochten und geschälten Kartoffeln gießen und 1–2 Stunden durchziehen lassen.','5. Mit Schnittlauch und/oder Petersilie servieren.','','Quelle: gutekueche.at'],'https://www.gutekueche.at/marinade-fuer-kartoffelsalat-rezept-22255'),
sn('rotwein','Rotweinsoße','Soßen',['250 ml Rotwein (trocken)','1 Schalotte, fein gehackt','1 Knoblauchzehe, gepresst','250 ml Rinder- oder Gemüsebrühe','1 TL Thymian (frisch oder getrocknet)','1 EL Tomatenmark','Salz und Pfeffer nach Geschmack','1 EL Butter','1 TL Mehl (optional, zum Andicken)'],['1. Butter im Topf schmelzen, Schalotte und Knoblauch darin glasig dünsten.','2. Tomatenmark einrühren und kurz anrösten, bis es leicht bräunlich wird.','3. Rotwein dazugießen und bei mittlerer Hitze einkochen, bis etwa die Hälfte verdampft ist.','4. Brühe und Thymian dazugeben und etwa 10 Minuten köcheln lassen.','5. Zum Andicken das Mehl mit etwas Wasser anrühren, langsam einrühren und kurz aufkochen.','6. Mit Salz und Pfeffer abschmecken. Für eine besonders feine Konsistenz durch ein Sieb passieren.','','Tipps: Für intensiveren Geschmack Wildfond oder Kalbsfond statt Gemüsebrühe nehmen. Ein Schuss Balsamico rundet ab. Passt zu Rinderfilet, Entenbrust oder Lammkoteletts.','Zubereitungszeit: 20 Minuten']),
sn('steaksossen','6 Soßen fürs Steak','Soßen',['Schwarze Pfeffersauce:','2 EL grob gestoßene schwarze Pfefferkörner','1 EL Butter','1 EL Öl','2 Schalotten, fein gehackt','60 ml Brandy','240 ml Rinderbrühe','1 EL Worcestershire','120 ml Schlagsahne','','Cremige Champignonsauce:','2 Knoblauchzehen','1–2 TL Balsamico oder Worcestershire','240 g braune Champignons in Scheiben','120 ml Schlagsahne','Salz und Pfeffer','','Sauce Béarnaise:','240 g geklärte Butter','2 EL Weißweinessig','2 EL gehackte Schalotten','3 Eigelb','1 EL frischer Estragon','Salz und Pfeffer','','Blauschimmelkäse-Sauce:','1 Schalotte','Butter','125 g Roquefort oder Gorgonzola','2 EL Weißwein','100 ml Schlagsahne','Pfeffer','Schnittlauch','','Knoblauch-Parmesan-Sauce:','4 Knoblauchzehen, gehackt','2 EL Butter','240 ml Schlagsahne','120 ml Hühnerbrühe','50 g Parmesan, gerieben','1 EL Zitronensaft','Petersilie','Salz und Pfeffer','','Grill-Kräuterbutter:','60 g weiche Butter','1 Knoblauchzehe, gehackt','1 TL Zitronensaft','1 TL Dijon-Senf','1 TL geräuchertes Paprikapulver','1 EL frische Petersilie, gehackt','1 Prise Cayennepfeffer','Salz'],['Schwarze Pfeffersauce: Schalotten anschwitzen, Pfeffer und Brandy zugeben und einköcheln lassen. Brühe und Worcestershire einrühren und reduzieren. Sahne zugeben und 2 Min. kochen.','','Cremige Champignonsauce: Im selben Bratenfett Knoblauch und Champignons anschwitzen. Balsamico und Sahne zugeben und 2–3 Min. reduzieren.','','Sauce Béarnaise: Essig mit Schalotten und Estragon reduzieren. Eigelb mit der Reduktion aufschlagen. Geklärte Butter in feinem Strahl einarbeiten.','','Blauschimmelkäse-Sauce: Schalotte in Butter anschwitzen. Wein zugeben, dann den Käse einschmelzen. Sahne einrühren und 1 Min. köcheln. Mit Schnittlauch garnieren.','','Knoblauch-Parmesan-Sauce: Knoblauch in Butter anschwitzen. Sahne und Brühe zugeben, Parmesan einschmelzen und mit Zitrone abschmecken.','','Grill-Kräuterbutter: Alles vermengen. Einen Esslöffel auf das heiße Steak geben (der Rest des Satzes ist im Screenshot abgeschnitten).','','Quelle: Facebook-Post (Screenshot)']),
sn('steakmarinade','Steakmarinade','Soßen',['½ Tasse Olivenöl','⅓ Tasse Sojasauce','⅓ Tasse frischer Zitronensaft','¼ Tasse Worcestershiresauce','3 EL getrocknetes Basilikum','1½ EL Knoblauchpulver','1½ EL getrocknete Petersilienflocken','1 TL weißer Pfeffer, gemahlen','1 TL getrockneter, gehackter Knoblauch (optional)','¼ TL scharfe Pfeffersauce (optional)'],['1. Alle Zutaten in einer mittelgroßen Schüssel gut vermengen.','2. In ein verschließbares Glas oder einen Beutel gießen und über die Steaks geben, bis das Fleisch gleichmäßig bedeckt ist.','3. Die Steaks mindestens 30 Minuten bis zu 24 Stunden im Kühlschrank marinieren. Je länger, desto intensiver.','4. Nach Belieben grillen, braten oder im Ofen garen.','','Reicht für 4–6 Steaks. Ca. 120 kcal pro Portion (Marinade).']),
sn('a1steaksauce','A1-Steaksauce','Soßen',['250 ml Ketchup','60 ml Balsamico-Essig','2 EL Dijon-Senf','2 EL Worcestershire-Sauce','1 EL brauner Zucker','1 TL Zitronensaft','1 TL Knoblauchpulver','½ TL Zwiebelpulver','½ TL Paprikapulver','¼ TL schwarzer Pfeffer','¼ TL Salz'],['1. Ketchup, Balsamico-Essig, Dijon-Senf und Worcestershire-Sauce in einem kleinen Topf vermengen.','2. Zucker, Zitronensaft, Knoblauch-, Zwiebel- und Paprikapulver, Pfeffer und Salz dazugeben und gut vermischen.','3. Bei mittlerer Hitze zum Kochen bringen, dann die Hitze reduzieren und 10–15 Minuten köcheln lassen, bis die Sauce dickflüssiger wird. Gelegentlich umrühren.','4. Abkühlen lassen, in ein Glas oder eine Flasche füllen und im Kühlschrank aufbewahren. Mehrere Wochen haltbar.']),
sn('tzatziki','Tzatziki','Soßen',['500 g griechischer Joghurt','1 Salatgurke','4 Knoblauchzehen, frisch','Salz und Pfeffer'],['1. Griechischen Joghurt gut durchrühren, er ist sehr fest.','2. Salatgurke schälen und grob raspeln oder in feine Julienne schneiden, einsalzen und warten, bis sich Gurkensaft absetzt.','3. Inzwischen die Knoblauchzehen schälen und in den Joghurt pressen.','4. Die Gurke in ein sauberes Tuch geben und den Saft abpressen. Die trockene Gurke in den Joghurt geben und unterrühren.','5. Etwas durchziehen lassen, dann mit Salz (vorsichtig) und Pfeffer abschmecken.','','Schmeckt zu Gyros und zu frischem selbstgebackenem Brot.','Quelle: Facebook-Post, Tzatziki aus Kreta']),
sn('schinkenjam','Schinkenjam','Soßen',['Schinken','Speck','Zwiebel','Knoblauch','Dunkler Balsamico','Honig','Zucker','Rotwein','Whisky'],['Schinken, Speck, Zwiebel und Knoblauch andünsten. Dunklen Balsamico, Honig, Zucker und Rotwein dazugeben und eindicken lassen. Zum Schluss Whisky dazugeben.','','Hinweis: Mengen stehen nicht in der Notiz.']),
sn('erdaepfelgulasch','Erdäpfelgulasch','Hauptspeise',['Zwiebel','Speck','Cabanossi','Paprikapulver','Salz, Pfeffer','Knoblauch','Kümmel','Suppenwürfel','Majoran','Kartoffeln, geschält und geschnitten','Rahm','Mehl'],['1. Zwiebel, Speck und Cabanossi andünsten, dann Paprikapulver dazu (wie beim Gulasch).','2. Ein bisschen Wasser, Salz, Pfeffer, Knoblauch, Kümmel, Suppenwürfel und Majoran dazugeben.','3. Die geschnittenen, geschälten Kartoffeln dazugeben und mit Wasser aufgießen, bis sie bedeckt sind.','4. Ca. eine Dreiviertelstunde köcheln lassen, bis die Kartoffeln weich sind.','5. Am Schluss Rahm mit etwas Mehl vermischen und einrühren, damit es sämig wird.','','Hinweis: Mengen stehen nicht in der Notiz (Handynotiz vom 12.12.2016).']),
sn('octopus','Gegrillter Oktopus mit Zitrone und Oregano','Hauptspeise',['900 g frische Kraken-Tentakel','3 EL natives Olivenöl extra, geteilt','2 Zitronen','2 TL schwarzer Pfeffer','1 EL frisch gehackter oder getrockneter Oregano','2 TL koscheres Salz'],['1. Die Tentakel gründlich unter kaltem Wasser abspülen und trocken tupfen.','2. Olivenöl, den Saft einer Zitrone, Pfeffer, Oregano und Salz zur Marinade vermischen.','3. Die Tentakel in die Marinade legen und gründlich bedecken. Mindestens 30 Minuten bis zu 4 Stunden marinieren, dabei gelegentlich wenden.','4. Den Grill auf mittlere bis hohe Hitze vorheizen. Die Tentakel aus der Marinade nehmen und abtropfen lassen.','5. Etwa 4–5 Minuten pro Seite grillen, bis sie leicht gebräunt und durchgegart sind.','6. Auf einer Platte mit frisch gepresstem Zitronensaft beträufeln.','7. Mit Zitronenscheiben und frischem Oregano garnieren und heiß servieren.','','Vorbereitung 10 Min., Marinierzeit 30 Min. bis 4 Std., Grillzeit 8–10 Min. 4 Portionen, ca. 210 kcal.','Quelle: Köstliche Rezepte (Facebook)']),
sn('honigfilet','Honig-Knoblauch-Schweinefilet','Hauptspeise',['2 Schweinefilets (je ca. 500 g)','3 Knoblauchzehen, gehackt','60 ml Honig','60 ml Sojasauce','2 EL Olivenöl','1 TL getrockneter Thymian','1 TL Paprikapulver','Salz und Pfeffer'],['1. Backofen auf 200 °C Ober-/Unterhitze vorheizen.','2. Honig, Sojasauce, Knoblauch, Thymian und Paprikapulver in einer kleinen Schüssel vermengen.','3. Die Filets mit Salz und Pfeffer würzen.','4. Olivenöl in einer ofenfesten Pfanne erhitzen und die Filets von allen Seiten goldbraun anbraten.','5. Die Honig-Knoblauch-Sauce über das Fleisch gießen.','6. Die Pfanne in den Ofen geben und die Filets 15–20 Minuten garen, bis die Kerntemperatur 63 °C erreicht.','7. Das Fleisch 5 Minuten ruhen lassen, in Scheiben schneiden und mit der Sauce servieren.']),
sn('geschnetzeltes','Italienisches Geschnetzeltes','Hauptspeise',['¾ kg Schweinsfiletspitzen, Braten oder Hühnerfleisch','¼ l Bratensaft','⅛ l Suppe','⅛ l Sauerrahm','1 Zwiebel','10 dag Frühstücksspeck','8 Essiggurkerl','½ Bund Petersilie','1 EL Mehl','Schnittlauch (Menge unsicher)','Nudeln','Salz, Pfeffer, Senf'],['1. Speck und Gurkerl in Streifen schneiden. Fleisch in Streifen schneiden, salzen und pfeffern.','2. Zwiebel würfelig schneiden und mit dem Speck anrösten. Das Fleisch dazugeben und anrösten, mit Suppe und Bratensaft aufgießen und aufkochen lassen.','3. Mit Salz, Pfeffer und Senf würzen.','4. Sauerrahm mit 1 EL Mehl verrühren, den Saft damit binden und kurz kochen lassen. Gurkerl und Petersilie dazugeben.','5. Nudeln in Butter schwenken, mit Salz und Pfeffer würzen, Schnittlauch untermischen.','','Saft: ¾ l Wasser mit 4 Bratensaft und ¼ l Wasser mit halbem Rindsuppenwürfel (Handschrift hier schlecht lesbar, bitte prüfen).','','Quelle: handgeschriebenes Rezeptbuch (Yvonne)']),
sn('carbonara','Kartoffeln alla Carbonara','Hauptspeise',['1 TL Salz','2 Knoblauchzehen, gehackt','3 Eigelb','150 g Truthahnspeck, gewürfelt','2 EL frische Petersilie, gehackt','50 g geriebener Parmesan','400 g Kartoffeln, geschält und gewürfelt','1 Prise schwarzer Pfeffer','100 ml Sahne'],['1. Kartoffelwürfel in kochendem Salzwasser weich kochen, abtropfen lassen und beiseitestellen.','2. Den Truthahnspeck in einer Pfanne knusprig braten, Knoblauch dazugeben und kurz anbraten.','3. Eigelb mit Parmesan, Sahne, Petersilie, Salz und Pfeffer in einer Schüssel verquirlen.','4. Die Kartoffeln zur Speckmischung in die Pfanne geben und gut vermischen. Die Eigelbmischung darübergießen und unter ständigem Rühren kochen, bis die Sauce eindickt.','5. Heiß servieren, nach Wunsch mit zusätzlichem Parmesan und Petersilie garnieren.','','Nährwerte laut Beschreibung: 380 kcal, 22 g Kohlenhydrate, 18 g Eiweiß, 25 g Fett.']),
sn('kokosspiesse','Kokos-Limetten-Hähnchenspieße','Hauptspeise',['500 g Hähnchenbrust, in Stücke','Saft und Schale von 1 Limette','100 ml Kokosmilch','1 EL Sojasauce','1 EL Honig','Salz, Pfeffer','Holzspieße'],['1. Alle Zutaten für die Marinade mischen und das Hähnchen darin 1 Stunde marinieren.','2. Das Fleisch auf Spieße stecken.','3. In einer Pfanne oder auf dem Grill ca. 10–12 Minuten garen, mehrmals wenden.','','4 Portionen.','Quelle: Karlas Kochkunst (Facebook)']),
sn('linsenlaberl','Linsen-Laberl','Hauptspeise',['200 g rote oder grüne Linsen','1 große Zwiebel, fein gewürfelt','2 Knoblauchzehen, gepresst','2 mittelgroße Karotten, gerieben','2 Eier (oder 2 Leinsamen-Eier für die vegane Variante)','50 g Haferflocken oder Paniermehl','2 EL frische Petersilie, gehackt','1 TL Kreuzkümmel','1 TL Paprikapulver (edelsüß)','Salz und Pfeffer','2 EL Olivenöl zum Braten'],['1. Linsen in ausreichend Wasser nach Packungsanweisung weich kochen (ca. 15–20 Minuten), abtropfen und leicht abkühlen lassen.','2. Die Linsen mit Gabel oder Kartoffelstampfer grob zerdrücken, sie sollen noch etwas Textur haben.','3. Zwiebel, Knoblauch, Karotten, Eier, Haferflocken, Petersilie und Gewürze dazugeben und gut vermengen, bis eine formbare Masse entsteht. Ist sie zu feucht, etwas mehr Haferflocken oder Paniermehl dazugeben.','4. Mit leicht angefeuchteten Händen kleine Laberl formen.','5. Olivenöl bei mittlerer Hitze erhitzen und die Laberl von beiden Seiten goldbraun braten (je ca. 3–4 Minuten pro Seite).','6. Warm mit Dip (z. B. Joghurt-Dip oder Hummus) oder als Beilage zu Salaten servieren (Ende im Screenshot abgeschnitten).']),
sn('linsenwrap','Linsenwrap','Hauptspeise',['Für 4–6 Wraps:','150 g rote Linsen','250 ml Wasser','1 kleine Chilischote','1 kleine Knoblauchzehe','½ TL Salz','1 Handvoll Petersilie','Etwas Öl zum Anbraten'],['1. Linsen mit Wasser bedecken und mindestens 3 Stunden einweichen.','2. Gut abspülen und in den Mixer geben. Chilischote, Knoblauchzehe, Salz und Wasser dazugeben und zu einer glatten Masse pürieren.','3. Petersilie hacken und unter den Linsenteig heben.','4. Etwas Öl in einer Pfanne erhitzen und die Wraps nacheinander ausbacken.','5. Nach Belieben belegen, im Original mit Frischkäse, gebratenen Champignons und Rucola.','','Quelle: kitchenachim (Facebook, 29.12.2024)']),
sn('linsenbolognese','Linsenbolognese','Hauptspeise',['Für 4 Portionen:','1 rote Zwiebel','1 Knoblauchzehe','1 Möhre','1 kleine Stange Sellerie','30 g Olivenöl','3 EL Tomatenmark (ca. 80 g)','200 g rote Linsen','400 g gehackte Dosentomaten','600 g Wasser','1 EL Gemüsebrühpulver','1 TL Paprikapulver, edelsüß','½ TL Currypulver','je ½ TL Oregano, Thymian, Rosmarin und Basilikum','1 TL Salz','¼ TL Pfeffer','1 Lorbeerblatt','1 Prise Chiliflocken','1 TL brauner Zucker','Pasta und Parmesan nach Belieben'],['Thermomix-Angaben, ca. 30 Minuten.','','1. Zwiebel, Knoblauch, Möhre und Sellerie 5 Sek. auf Stufe 5 zerkleinern.','2. Öl und Tomatenmark zugeben und 5 Min. bei 120 °C auf Stufe 1 dünsten.','3. Linsen, Tomaten, Wasser, Brühpulver, Gewürze, Kräuter, Salz, Pfeffer, Lorbeerblatt, Chili und Zucker dazugeben, einmal umrühren. Gareinsatz statt Messbecher als Spritzschutz aufsetzen und 20 Min. bei 100 °C, Linkslauf, Stufe 2 garen.','4. Währenddessen die Pasta kochen. Abgießen, nicht abschrecken, mit einer Kelle Sauce vermengen.','5. Pasta auf Teller verteilen und mit der restlichen Linsenbolognese übergießen.','','Flüssigkeitsmenge je nach gewünschter Konsistenz anpassen.','Quelle: Food with Love (Thermomix Rezepte mit Herz), Kurzfassung der Seite'],'https://www.foodwithlove.de/linsenbolognese.html'),
sn('roastbeefmarcher','Roastbeef mit Preiselbeer-Soße','Hauptspeise',['Für 4 Personen:','','Roastbeef:','1 kg Beiried im Ganzen, mit Fettrand','Meersalz','Pfeffer, frisch gemahlen','4 Zweige Thymian','1 EL scharfer Senf','Öl zum Braten','','Preiselbeer-Soße:','12 Schalotten','Zucker','300 g Preiselbeermarmelade','200 ml Rinderfond','150 ml roter Traubensaft','3 Zweige Thymian','1 Zweig Rosmarin','Meersalz','Pfeffer, frisch gemahlen'],['1. Backofen auf 120 °C Ober-/Unterhitze vorheizen. Das Fleisch trocken tupfen, den Fettrand keinesfalls entfernen. Thymian fein hacken, mit Senf verrühren, mit Salz und Pfeffer würzen und das Roastbeef rundherum damit einstreichen.','2. In einer großen Pfanne etwas Öl erhitzen, das Fleisch auf der Fettseite scharf anbraten, dann von allen Seiten je 1–2 Minuten, auch die Enden. Beim Wenden nicht mit der Gabel ins Fleisch stechen.','3. Das Beiried auf einen Ofenrost legen und in der Mitte des Ofens 35–40 Minuten garen (Kerntemperatur höchstens 60 °C, dann ist es rosa). Bei Bedarf ein Blech als Tropfschutz unterschieben.','4. Soße: Schalotten mit kochend heißem Wasser übergießen, kurz ziehen lassen, schälen und in schmale Streifen schneiden. Etwas Zucker im Topf karamellisieren, Schalotten dazugeben, mit Fond und Traubensaft ablöschen, Preiselbeermarmelade einrühren. Thymian und Rosmarin mitkochen und ca. eine halbe Stunde cremig einkochen. Mit Salz, Pfeffer und evtl. Zucker abschmecken, Kräuter entfernen.','5. Das Fleisch herausnehmen, kurz in Alufolie wickeln und ein paar Minuten rasten lassen. In Scheiben schneiden und mit der Soße servieren.','','Zeitaufwand 1 Std. 15 Min.','Quelle: Marcher Fleischwerkstatt (PDF)']),
sn('roastbeefgrill','Roastbeef vom Grill','Hauptspeise',['Für 4 Personen:','1,2 kg Roastbeef','3 EL bunte Pfeffermischung, grob gemahlen','1–2 Zweige frischer Rosmarin','1–2 Zweige frischer Thymian','2–3 EL Dijon-Senf','1–2 EL grobes Meersalz','Frischhaltefolie, Grillthermometer'],['1. Den dicken Fettdeckel oben mit einem scharfen Messer abschneiden und aufbewahren.','2. Thymian und Rosmarin hacken, mit Senf und Pfeffermischung gut ins Fleisch einreiben. Fettdeckel wieder auflegen, in Frischhaltefolie wickeln und 3–4 Stunden kühl stellen.','3. Das Fleisch ca. 1 Stunde vor dem Grillen aus dem Kühlschrank nehmen. Grill auf 100–110 °C für indirektes Grillen vorheizen. Folie entfernen, Fettdeckel kurz abnehmen, Fleisch grob salzen, Deckel wieder auflegen und das Thermometer einstechen. Auf die indirekte Zone legen. Nach 45 Minuten den Fettdeckel entfernen und den Grilldeckel schließen.','4. Bei 54 °C Kerntemperatur die Hitze voll aufdrehen oder die Glut direkt unter das Fleisch schieben und ca. 3 Minuten scharf anbraten. Am Ende 56 °C Kerntemperatur, dann ist es rosa.','5. ca. 10 Minuten in Alufolie ruhen lassen und quer zur Faser dünn aufschneiden.','','Garpunkte: 52–54 °C rare, 56–58 °C medium.','Vorbereitung 15 Min., Grillzeit 1 Std. 30 Min.','Quelle: grillkameraden.de, Kurzfassung der Seite'],'https://www.grillkameraden.de/roastbeef-vom-grill-rezept-und-anleitung/'),
sn('rosenkohl','Rosenkohl-Hackfleisch-Auflauf','Hauptspeise',['1 Zwiebel, gehackt','500 g Hackfleisch','500 g Rosenkohl, halbiert','2 Knoblauchzehen, gehackt','200 g geriebener Gouda','200 ml Sahne','1 Dose gehackte Tomaten','Salz und Pfeffer','Frische Petersilie zum Garnieren'],['1. Ofen auf 180 °C vorheizen, eine Auflaufform einfetten.','2. Zwiebel und Knoblauch anbraten, bis sie glasig sind. Hackfleisch dazugeben und anbraten, bis es braun ist. Mit Salz und Pfeffer würzen.','3. Rosenkohl dazugeben und ca. 5 Minuten kochen, bis er etwas weicher wird.','4. Gehackte Tomaten dazugeben und weitere 5 Minuten köcheln lassen. Sahne unterrühren.','5. Die Mischung in die Auflaufform geben und mit Gouda bestreuen.','6. Im vorgeheizten Ofen ca. 25–30 Minuten backen, bis der Käse goldbraun ist.','7. Mit frischer Petersilie garnieren und servieren.','','Nährwerte laut Beschreibung: 380 kcal, 10 g Kohlenhydrate, 25 g Eiweiß, 28 g Fett.']),
sn('rinderbraten','Toskanischer Rinderbraten mit Gemüse','Hauptspeise',['900 g Rinderschulterbraten','1 EL Olivenöl','1 Zwiebel, gehackt','2 Karotten, gehackt','2 Stangen Sellerie, gehackt','3 Knoblauchzehen, gehackt','480 ml Rinderbrühe','1 Dose (400 g) gehackte Tomaten','1 TL getrockneter Rosmarin','1 TL getrockneter Thymian','Salz und Pfeffer','2 EL frische Petersilie, gehackt (zum Garnieren)'],['1. Olivenöl im großen Topf oder Schmortopf bei mittlerer Hitze erhitzen. Das Fleisch mit Salz und Pfeffer würzen, von allen Seiten anbraten, bis es schön gebräunt ist. Herausnehmen und beiseitestellen.','2. Zwiebel, Karotten und Sellerie in den Topf geben und 5–7 Minuten anbraten, bis das Gemüse weich ist.','3. Knoblauch dazugeben und eine weitere Minute anbraten.','4. Das Fleisch wieder in den Topf geben, Rinderbrühe, Tomaten, Rosmarin und Thymian dazugeben und gut vermischen.','5. Deckel aufsetzen und bei schwacher Hitze etwa 3–4 Stunden köcheln lassen, bis das Fleisch zart ist und sich leicht mit der Gabel auseinanderziehen lässt. Alternativ im auf 150 °C vorgeheizten Ofen garen.','6. Vor dem Servieren mit frischer Petersilie garnieren.','','Vorbereitung 15 Min., Garzeit 3–4 Std.']),
sn('zwiebelrostbraten','Zwiebelrostbraten','Hauptspeise',['Für 4 Portionen:','','Röstzwiebeln:','400 g Zwiebeln, geschält','Mehl zum Bestauben','Reichlich Öl zum Frittieren','','Rostbraten:','800 g Rostbratenried, geputzt','Salz','Pfeffer','Mehl zum Bestauben','3 EL Öl zum Braten','','Saft:','0,2 l Suppe, Fond (braun) oder Wasser','20 g Butter'],['1. Zwiebeln in feine Ringe schneiden, in Mehl wenden, abschütteln. Öl in einer tiefen Pfanne erhitzen, Zwiebelringe unter ständigem Rühren mit einer Fleischgabel hellbraun backen. Herausheben, abpressen, mit einer Gabel auflockern, abtropfen lassen und auf Küchenkrepp locker verteilen, warm stellen.','2. Fleisch in 4 Scheiben schneiden, ca. 6 mm dünn plattieren und die Ränder einschneiden. Beidseitig mit Salz und Pfeffer würzen. Eine Seite gleichmäßig mit Mehl bestauben, abschütteln, leicht anpressen.','3. Öl erhitzen, Rostbraten mit der bemehlten Seite nach unten einlegen. Kräftig braun anbraten, wenden, kurz auf der zweiten Seite braten. Das Fleisch soll auf den Punkt gebraten sein.','4. Aus der Pfanne heben, mit Alufolie bedecken, warm stellen.','5. Fett aus der Pfanne gießen, Suppe (braunen Fond oder Wasser) zugießen und reduzierend kochen, bis sich der Bratensatz löst. Saft aufkochen, kalte Butter in Stücken einrühren, eventuell seihen.','6. Rostbraten mit der zuerst gebratenen Seite in den Saft legen. Nicht aufkochen, mehrmals wenden, damit sich der Saft aromatisiert.','7. Anrichten und heiße, leicht gesalzene Röstzwiebeln darüber verteilen.','','Gardauer ca. 3 Minuten.','Quelle: Kochbuch, Seite 154 (Variation Vanillerostbraten steht auf der Folgeseite, nicht gespeichert)']),
sn('schuettelpizza','Schüttelpizza mit Haferflocken und Hüttenkäse','Hauptspeise',['150 g Haferflocken (fein gemahlen oder als Hafermehl)','250 g Hüttenkäse','3 Eier'],['Hinweis: Im Screenshot ist nur der Anfang der Zutatenliste zu sehen, der Rest und die Zubereitung fehlen.','Auf dem Foto belegt mit Schinkenwürfeln, Mais, Paprika, Frühlingszwiebeln und Käse.']),
sn('frittaten','Frittatenknödel','Vorspeise',['250 g Frittaten','2 Eier','60 g geschmolzene Butter','2 EL Milch','1 EL Rahm','Petersilie, gehackt','Salz','Muskat'],['1. Alle Zutaten verrühren und über die Frittaten gießen. Gut vermengen.','2. In Klarsichtfolie rollenförmig eindrehen, abbinden und in Salzwasser 20 Minuten kochen.','3. Folie entfernen, in Scheiben schneiden und in Rindsuppe einlegen.','','Die Knödel passen auch gut zu cremigen Soßen.','Quelle: Hießböck 2000']),
sn('cremespinat','Cremespinat','Beilage',['Für 4 Portionen:','800 g Blattspinat, roh','Salz','50 g Butter','20 g Mehl','0,3 l Rindsuppe, heiß','Pfeffer','2–3 Knoblauchzehen, gepresst'],['1. Spinat entstielen und in einer großen Schüssel mit kaltem Wasser gut waschen. Aus dem Wasser heben, je nach Verschmutzung wiederholen und dabei das Wasser wechseln.','2. Salzwasser zum Kochen bringen, Spinat beigeben und unter die Wasseroberfläche drücken. Nach ca. 3–5 Minuten mit einem Schaum- oder Gitterlöffel herausheben und in reichlich Eiswasser abschrecken.','3. Abgießen, gut ausdrücken und fein faschieren. 20 g Butter schmelzen, Mehl kurz anschwitzen, mit dem Großteil der Suppe aufgießen, mit dem Schneebesen gut verrühren und 5 Minuten kochen. Bei Klümpchen passieren.','4. Mit dem Spinat vermischen und aufkochen (Spritzgefahr). Restliche Butter in einer kleinen Pfanne bräunen und sofort in den Spinat rühren.','5. Mit Pfeffer, Salz und Knoblauch würzen. Falls nötig die Konsistenz mit Suppe korrigieren.','','Gardauer 10–15 Minuten.','Quelle: Kochbuch, Seite 78']),
sn('kohl','Kohl nach Wiener Art','Beilage',['Für 6 Portionen:','800 g Kohl, geputzt','Salz','20 g Butter','20 g Mehl','¼ l Rindsuppe','60 g Frühstücksspeck','1–2 Knoblauchzehen, gepresst','Pfeffer'],['1. Kohl von den Außenblättern befreien, halbieren, den Strunk herausschneiden. Kohl in grobe Streifen schneiden.','2. In Salzwasser knackig kochen, abseihen, in kaltem Wasser abfrischen, abseihen, abpressen und grob hacken.','3. In einer Kasserolle Butter schmelzen, Mehl einrühren, hell anschwitzen, mit heißer Suppe aufgießen und mit dem Schneebesen glatt verrühren. Kohl einrühren und ca. 5 Minuten kochen.','4. Speck in Würfel schneiden, in einer Pfanne rösten, unter den Kohl mischen, mit Knoblauch, Salz und Pfeffer würzen.','','Tipp: Für die vegetarische Variante statt Speck etwas gebräunte Butter beigeben.','Quelle: Kochbuch (die Notiz hieß Kohlrabi nach Wiener Art, das Rezept ist aber Kohl)']),
sn('huettenkaesetaler','Hüttenkäsetaler','Beilage',['Ergibt ca. 10 Taler:','2 Eier (Größe M/L)','200 g Hüttenkäse (mager oder klassisch)','80 g Haferflocken (zart oder fein gemahlen)','30 g geriebener Käse (z. B. Parmesan oder Gouda, optional)','1 TL gehackte frische Kräuter (Petersilie, Schnittlauch, Dill)','Salz und Pfeffer','1 EL Öl oder Butter zum Anbraten (z. B. Rapsöl oder Butterschmalz)'],['1. Falls gewünscht, die Haferflocken im Mixer fein mahlen, das gibt eine gleichmäßigere Konsistenz.','2. Eier, Hüttenkäse, Haferflocken, geriebenen Käse und Kräuter in einer Schüssel vermengen. Mit Salz und Pfeffer würzen (vorsichtig salzen, der Käse ist oft schon salzig).','','Zubereitung 15 Min., Kochzeit 10–12 Min., gesamt ca. 25–30 Min.','Hinweis: Der Rest der Anleitung (Formen und Braten) ist im Screenshot abgeschnitten.']),
sn('zucchinipommes','Zucchinipommes aus der Heißluftfritteuse','Beilage',['Für 2 Portionen:','2 mittelgroße Zucchini','2 EL Semmelbrösel oder Panko','2 EL geriebener Parmesan','1 Ei','1 TL Knoblauchpulver','1 TL italienische Kräuter','Salz und Pfeffer','Etwas Olivenöl-Spray'],['1. Zucchini waschen, Enden abschneiden und in Pommes-Streifen schneiden.','2. Ei in einer Schüssel verquirlen. In einer zweiten Schüssel Semmelbrösel, Parmesan, Knoblauchpulver, Kräuter, Salz und Pfeffer vermischen.','3. Die Zucchinistifte zuerst in Ei tauchen, dann in der Bröselmischung wälzen.','4. Heißluftfritteuse auf 190 °C vorheizen. Die panierten Stifte in den Korb legen, leicht mit Olivenöl besprühen und 12–15 Minuten goldbraun backen, dabei einmal wenden.','5. Mit Joghurt-Kräuter-Dip oder Aioli servieren.','','Quelle: Minna Jaeger (Facebook)']),
sn('thunfischgurke','Thunfisch-Gurken-Häppchen','Fitness-Meal',['Für 2 Portionen:','240 g Salatgurke','220 g Thunfisch aus der Dose im eigenen Saft','60 g Mayonnaise','85 g Zwiebeln','40 g Apfel','½ TL Knoblauchpulver','½ TL Paprikapulver','Salz und Pfeffer','Optional: etwas Zitronensaft'],['1. Den Thunfisch abtropfen lassen und in eine Schüssel geben.','2. Mayonnaise dazugeben. Zwiebel und Apfel kleinschneiden und ebenfalls in die Schüssel geben. Gut verrühren und mit Salz, Pfeffer, Knoblauch- und Paprikapulver abschmecken. Nach Belieben Zitronensaft zugießen.','3. Die Gurke waschen und in 1–2 cm dicke Scheiben schneiden. Mit Küchenpapier abtupfen, um etwas Wasser aufzunehmen.','4. Die Thunfisch-Creme auf den Gurkenscheiben verteilen, nicht zu sparsam.','5. Nach Belieben mit Kräutern bestreuen.','','Nährwerte pro Portion (300 g) laut Beschreibung: 391 kcal, 33 g Eiweiß, 26 g Fett, 7 g Kohlenhydrate. Zubereitung 10 Min.','Quelle: LowcarbBenni (Facebook)']),
sn('proteinriegel','Protein-Energieriegel (vegan)','Fitness-Süßes',['100 g Walnüsse','50 g Haferflocken','90 g getrocknete Aprikosen','50 g Reisproteinpulver (oder veganes Proteinpulver)','40 g Ahornsirup','40 g Mandelmus','20 g Kokosraspeln'],['1. Walnüsse und Haferflocken in den Mixer geben und fein zerkleinern.','2. Die restlichen Zutaten beigeben und zerkleinern, bis eine teigige Masse entstanden ist.','3. Die Masse in einer rechteckigen Form verteilen und gut andrücken. Die Form ca. 1 Stunde in den Kühlschrank stellen.','4. Die Masse aus der Form heben und mit dem Messer in Riegel schneiden. Im Kühlschrank lagern oder für längere Zeit einfrieren.','','Zubereitung 20 Min.','Quelle: mrsflury.com/protein-riegel-vegan']),
sn('griessbrei','High-Protein-Grießbrei','Fitness-Süßes',['250 ml Milch','40 g Weichweizengrieß','150 g Magerquark','1 Scoop (30 g) Proteinpulver (optional)','Süße nach Wahl','Toppings: Himbeeren, Heidelbeeren, Zimt, Walnüsse, Schokolade'],['Hinweis: Das Bild zeigt nur die Zutaten, keine Zubereitung.']),
sn('fuenfminutenbrot','5-Minuten-Brot','Brot & Gebäck',[],['Nur der Link ist gespeichert. Die Seite ist inzwischen nicht mehr erreichbar (Fehler 404). Rezept bei Bedarf neu suchen oder eintragen.'],'http://www.resize.at/news-blog/rezepte/219-5-minuten-brot.html'),
sn('dinkelbrot','Schnelles Dinkelbrot','Brot & Gebäck',['Für 1 große Kastenform:','30 g frische Hefe (oder 1 Pkg. Trockenhefe)','280 g lauwarmes Wasser','500 g Dinkelmehl (oder Dinkelvollkornmehl)','15 g Salz','10 g Zucker oder Honig'],['1. Hefe im lauwarmen Wasser auflösen. Restliche Zutaten dazugeben und 5–7 Minuten zu einem glatten Teig kneten.','2. Zugedeckt an einem warmen Ort 30 Minuten ruhen lassen.','3. In eine mit Backpapier ausgelegte Kastenform geben und nochmal 30–45 Minuten gehen lassen, bis sich das Volumen deutlich vergrößert hat.','4. Backofen auf 220 °C vorheizen. Die Teigoberfläche mit Wasser besprühen und ca. 45 Minuten backen.','','Das Brot lässt sich in Scheiben einfrieren. Gesamtzeit ca. 70 Minuten.','Quelle: finis-feinstes.at, Kurzfassung der Seite'],'https://www.finis-feinstes.at/r/schnelles-dinkelbrot-911/'),
sn('briochebuns','Brioche Burger Buns','Brot & Gebäck',['Ergibt ca. 8 Stück:','25 g Milch (Handschrift, Menge unsicher)','200 g Wasser','5 g Hefe','30 g Zucker','485 g Weizenmehl','1½ TL Salz','80 g weiche Butter','2 Eier (1 für den Teig, 1 zum Bestreichen)','Sesam zum Bestreuen'],['1. Milch, Wasser, Hefe und Zucker erwärmen (nicht kochen). 15 Minuten ruhen lassen.','2. 1 Ei, Salz, Mehl und Butter dazugeben und sehr lange zu einem Teig kneten.','3. Den Teig zugedeckt 1 Stunde gehen lassen.','4. Teig in ca. 8 Portionen teilen, zu Buns formen und auf ein Backblech mit Backpapier legen. Nochmal 1 Stunde gehen lassen.','5. Backofen auf 200 °C Ober-/Unterhitze vorheizen.','6. Das zweite Ei mit 1 EL Wasser mischen, die Buns damit bestreichen und mit Sesam bestreuen. Ca. 15 Minuten backen.']),
sn('proteinbroetchen','High-Protein-Brötchen','Brot & Gebäck',['150 g Magerquark','2 Eier','100 g Light-Gouda, gerieben','2 EL Chiasamen','3 EL Leinsamen, geschrotet','4 EL Dinkelmehl oder Haferflocken, gemahlen','1 TL Backpulver','Salz','Körner zum Wälzen (z. B. Haferflocken, Sonnenblumenkerne)'],['1. Alle Zutaten zu einem Teig verrühren. Der Teig ist sehr matschig.','2. Körner auf einen Teller geben, kleine Haufen vom Teig darin wälzen und auf ein Blech setzen.','3. 14 Minuten bei 190 °C backen (im Original in der Heißluftfritteuse).','','Variationen: eine große geriebene Möhre dazugeben, oder für den Geschmack Bacon, Schafskäse, getrocknete Tomaten oder Würfelzwiebeln.','Quelle: Facebook-Post (Screenshot)']),
sn('pizzateig','Pizzateig Karin','Brot & Gebäck',['1 Germ (Hefe, Handschrift schlecht lesbar)','½ kg glattes Mehl','340 ml lauwarmes Wasser','3 EL Olivenöl','2 EL Zucker','1 EL Salz'],['1–2 mal gehen lassen, 7 Min. bei 250 °C Ober- und Unterhitze backen.','','Quelle: handgeschriebene Notiz (Pizzabrot Karin)'])
];

sn('skyrkuchen','Protein-Skyr-Kuchen','Fitness-Süßes',['5 Eigelb','1 Packung (450 g) Skyr','1 Packung (37 g) Puddingpulver Vanille','Süßungsmittel (im Original Real Flavor von Prozis)','5 Eiklar, zu Eischnee geschlagen'],['Backofen: 160 °C Ober-/Unterhitze, ca. 35–40 Minuten.','','Nährwerte für den ganzen Kuchen laut Beschreibung: 663 kcal, 31 g Kohlenhydrate, 78 g Eiweiß, 24 g Fett.','','Hinweis: Die Beschreibung nennt keine Schritte, keine Menge für das Süßungsmittel und keine Formgröße. In den Kommentaren wird mehrfach nach der Form gefragt, und ein Kommentar schreibt, der Kuchen sei innen noch flüssig gewesen. Vermutlich: Eigelb, Skyr, Puddingpulver und Süße verrühren und den Eischnee unterheben.','Quelle: Noel Reinbold (Instagram)'],'https://www.instagram.com/reel/DbVDgppooai/'),
sn('chiatoast','Chia-Protein-Toast','Fitness-Meal',['Für 2 Sandwich-Toasts:','2 Eier','100 g Skyr','30 g Chiasamen','1 Prise Salz'],['1. Alle Zutaten in den Mixer geben und kurz mixen. Die Masse etwas quellen lassen. Alternativ Eier, Skyr und Salz verrühren, Chiasamen unterheben und quellen lassen.','2. Kontaktgrill oder Gerät mit Kontaktgrillplatten vorheizen. Pro Toast etwa 3 EL Masse hineingeben, Deckel schließen und backen, bis der Toast fest und durchgegart ist.','','Nährwerte pro Toast laut Beschreibung (ca.): 178 kcal, 15 g Eiweiß, 5 g Ballaststoffe, 9,5 g Fett, 4 g Kohlenhydrate.','Hinweis: Ohne Kontaktgrill nennt die Beschreibung keine Alternative (in den Kommentaren gefragt).','Quelle: herrlich_ehrlich73 (Instagram)'],'https://www.instagram.com/reel/DepLDrdAdSG/')
];
const katsAus=(a,rez)=>[...(Array.isArray(a)?a:[]),...rez.map(r=>r.kat)].map(k=>String(k).trim().slice(0,30)).filter((k,i,x)=>k&&!KATS.includes(k)&&x.indexOf(k)===i).slice(0,20);
function normK(r){r=r||{};const b=String(r.bild||''),v=String(r.video||'').trim();return{id:typeof r.id==='string'&&/^[\w-]{1,40}$/.test(r.id)?r.id:neueId(),name:String(r.name||'Rezept').slice(0,80),kat:String(r.kat||KATS[1]).trim().slice(0,30)||KATS[1],bild:b.length<400000&&/^data:image\/jpeg;base64,[\w+/=]+$/.test(b)?b:'',video:/^https?:\/\/\S{1,500}$/i.test(v)?v:'',zutaten:String(r.zutaten||'').slice(0,4000),text:String(r.text||'').slice(0,8000),geaendertAm:Number(r.geaendertAm)||0}}
function ladenK(){let d=null;try{d=JSON.parse(localStorage.getItem(KKEY))}catch(e){}
 d=d&&typeof d==='object'?d:{};const alt=Array.isArray(d.rezepte),l=alt?d.rezepte:[VITELLO,GANS,MAYO,CHIA,TALER,BUTTER,COTTAGE,BROWNIE,PKUCHEN,...NOTIZEN,...NEU];
 if(alt)[[2,GANS],[3,MAYO],[4,CHIA],[5,TALER],[6,BUTTER],[7,COTTAGE],[9,BROWNIE],[9,PKUCHEN],...NOTIZEN.map(n=>[10,n]),...NEU.map(n=>[11,n])].forEach(([v,n])=>{if(!(d.v>=v)&&!l.some(r=>r&&r.id===n.id))l.push(n)});
 if(alt&&!(d.v>=8))[TALER,BUTTER,COTTAGE].forEach(n=>{const i=l.findIndex(r=>r&&r.id===n.id&&!r.geaendertAm);if(i>=0)l[i]=n});
 if(alt&&!(d.v>=12)){l.forEach(r=>{if(r&&r.kat==='Snack')r.kat='Fitness-Meal'});(d.links||[]).forEach(x=>{if(x&&x.k==='Snack')x.k='Fitness-Meal'})}
 const rez=l.map(normK);return{v:KV,rezepte:rez,kats:katsAus(Array.isArray(d.kats)?d.kats.filter(k=>k!=='Snack'):d.kats,rez),links:(Array.isArray(d.links)?d.links:[]).filter(x=>x&&FORM.e[x.k]&&code(x.u)&&!rez.some(r=>code(r.video)===code(x.u))).map(x=>({k:x.k,u:String(x.u).slice(0,500)}))}}

function verkleinern(file){return new Promise((ok,nein)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.75))};im.onerror=()=>{URL.revokeObjectURL(u);nein()};im.src=u})}

 +'<label class="fld"><span>Video-Link (optional)</span><input id="kV" type="url" inputmode="url" autocomplete="off" placeholder="https://" value="'+esc(f.video)+'"></label></section>'
 +'<button class="btn" data-act="kSave">'+ic('mark')+'Rezept speichern</button>'}

const ROUTEN={start:vStart,rechner:vRechner,rezepte:vRezepte,zeitplan:vZeitplan,kochen:vKochen,kat:vKat,koch:vKoch,kform:vKForm};
const NAV=[['start','slice','Start'],['rezepte','book','Rezepte'],['zeitplan','clock','Zeitplan']];
const ansicht=()=>{const h=location.hash.slice(1);return ROUTEN[h]?h:'start'};
function render(){const v=ansicht();document.documentElement.dataset.theme=S.theme;
 document.querySelector('meta[name=theme-color]').content=S.theme==='dark'?'#151210':'#FAF5EE';
 $('#app').innerHTML=ROUTEN[v]();
 $('nav.tabs').innerHTML=(['rechner','rezepte','zeitplan'].includes(v)?NAV:[]).map(n=>'<a href="#'+n[0]+'"'+(n[0]===v?' aria-current="page"':'')+'>'+ic(n[1])+n[2]+'</a>').join('');
 if(v!==letzte){window.scrollTo(0,0);letzte=v}}

async function wechsle(id){if(id===S.aktiv)return true;if(!await verwerfenOk())return false;const r=S.rezepte.find(x=>x.id===id);if(!r)return false;S.aktiv=id;S.entwurf=norm(r);ui.hefeEdit=false;ui.schritteEdit=false;sichern();return true}
function kopieVon(basis,name){const r=norm(Object.assign({},basis,{id:neueId(),name,geaendertAm:Date.now()}));S.rezepte.push(r);S.aktiv=r.id;S.entwurf=norm(r);sichern();return r}
function setze(f,v){S.entwurf[f]=v;if(f==='hefeart')S.entwurf.hefeManuell=null;sichern();patchRechner()}
function klemme(f,v){const[,mn,mx,d]=SP[f];return Math.round(Math.min(mx,Math.max(mn,v))*Math.pow(10,d+1))/Math.pow(10,d+1)}
const parse=s=>parseFloat(String(s).replace(',','.'));

const AKT={
 theme(){S.theme=S.theme==='dark'?'light':'dark';sichern();render()},
 step(b){const f=b.dataset.f,n=Number(b.dataset.d);if(GS[f])setzeG(f,+GW[f](S.entwurf).toFixed(GS[f][1])+n*GS[f][0]);else setze(f,klemme(f,S.entwurf[f]+n*SP[f][0]))},
 art(b){setze('hefeart',b.dataset.v)},
 hefeEdit(){ui.hefeEdit=!ui.hefeEdit;$('#hefebox').innerHTML=hefeHtml();const i=$('#hefeIn');if(i)i.focus()},
 hefeAuto(){S.entwurf.hefeManuell=null;sichern();patchRechner()},
 schritteAuf(){ui.schritteAuf=!ui.schritteAuf;$('#schr').innerHTML=schritteHtml()},
 schritteEdit(){ui.schritteEdit=!ui.schritteEdit;$('#schr').innerHTML=schritteHtml();const t=$('#schrIn');if(t)t.focus()},
 speichern(){const a=aktivRez();FELDER.forEach(k=>a[k]=S.entwurf[k]);a.geaendertAm=Date.now();sichern();dirtyDot();toast('Rezept gespeichert')},
 async kopie(){const n=await fragen('Kopie erstellen','Name für die Kopie von „'+S.entwurf.name+'“',{eingabe:S.entwurf.name+' Kopie',ok:'Erstellen'});if(n===null)return;kopieVon(S.entwurf,n);render();toast('Kopie erstellt')},
 async neu(){const n=await fragen('Neues Rezept','Startet mit den Werten des Grundrezepts.',{eingabe:'Neues Rezept',ok:'Erstellen'});if(n===null)return;if(!await verwerfenOk())return;kopieVon(GRUND,n);location.hash='#rechner'},
 async oeffne(b){if(await wechsle(b.dataset.id))location.hash='#rechner'},
 menue(b){const r=S.rezepte.find(x=>x.id===b.dataset.id);if(!r)return;ui.menuId=r.id;$('#mT').textContent=r.name;zeige($('#mn'),menuAktion)},
 export(){exportieren()},
 import(){$('#imp').click()},
 kKat(b){ui.kochKat=b.dataset.k;location.hash='#kat'},
 kNeu(){const k=location.hash==='#kat'&&ui.kochKat!=null;ui.kform={id:null,name:'',kat:k?ui.kochKat:KATS[1],bild:'',video:'',zutaten:'',text:'',zurueck:k?'#kat':'#kochen'};location.hash='#kform'},
 kOeffne(b){const r=K.rezepte.find(x=>x.id===b.dataset.id);ui.kochId=b.dataset.id;ui.kochKat=r?r.kat:null;location.hash='#koch'},
 kEdit(){const r=K.rezepte.find(x=>x.id===ui.kochId);if(r){ui.kform=Object.assign({},r,{zurueck:'#koch'});location.hash='#kform'}},
 async kLink(b){const k=b.dataset.k,n=await fragen('Link einfügen','Instagram-Link für „'+k+'“',{eingabe:'',ok:'Senden'});if(n===null)return;const u=n.trim(),c=code(u);
  if(!c)return toast('Das ist kein Instagram-Link');if(K.rezepte.some(r=>code(r.video)===c))return toast('Dieses Rezept ist schon da');if(K.links.some(x=>code(x.u)===c))return toast('Link ist schon eingetragen');
  try{await fetch(FORM.url,{method:'POST',mode:'no-cors',body:new URLSearchParams({[FORM.e[k]]:u})})}catch(e){return toast('Senden fehlgeschlagen – Internet? Bitte nochmal')}
  K.links.push({k,u:u.slice(0,500)});sichernK();render();toast('Link gesendet')},
 kBild(){$('#kFile').click()},
 kBildWeg(){ui.kform.bild='';$('#kPrev').innerHTML=prevHtml()},
 kSave(){const f=ui.kform,n=$('#kN').value.trim(),v=$('#kV').value.trim();if(!n)return toast('Titel fehlt');if(v&&!/^https?:\/\/\S+$/i.test(v))return toast('Video-Link muss mit https:// beginnen');
  const r=normK({id:f.id,name:n,kat:f.kat,bild:f.bild,video:v,zutaten:$('#kZ').value,text:$('#kT').value,geaendertAm:Date.now()});
  K.rezepte=f.id?K.rezepte.map(x=>x.id===r.id?r:x):[...K.rezepte,r];sichernK();ui.kochId=r.id;ui.kochKat=r.kat;ui.kform=null;location.hash='#koch';toast('Rezept gespeichert')},
 async kDel(){const r=K.rezepte.find(x=>x.id===ui.kochId);if(!r||!await fragen('Rezept löschen?','„'+r.name+'“ wird endgültig gelöscht.',{ok:'Löschen'}))return;K.rezepte=K.rezepte.filter(x=>x.id!==r.id);sichernK();ui.kochId=null;location.hash=K.rezepte.some(x=>x.kat===r.kat)?'#kat':'#kochen';toast('Rezept gelöscht')}
};
async function menuAktion(a){const r=S.rezepte.find(x=>x.id===ui.menuId);if(!r||!a)return;
 if(a==='kopie'){const n=await fragen('Kopie erstellen','Name für die Kopie von „'+r.name+'“',{eingabe:r.name+' Kopie',ok:'Erstellen'});if(n===null)return;if(!await verwerfenOk())return;kopieVon(r,n);render();toast('Kopie erstellt')}
 if(a==='loeschen'){if(!await fragen('Rezept löschen?','„'+r.name+'“ wird endgültig gelöscht.',{ok:'Löschen'}))return;S.rezepte=S.rezepte.filter(x=>x.id!==r.id);if(!S.rezepte.length)S.rezepte=[norm(GRUND)];if(S.aktiv===r.id){S.aktiv=S.rezepte[0].id;S.entwurf=norm(S.rezepte[0])}sichern();render();toast('Rezept gelöscht')}}

async function exportieren(){const d={app:'glut',version:2,exportiert:new Date().toISOString(),aktiv:S.aktiv,rezepte:S.rezepte,koch:K.rezepte,kats:K.kats};const name='glut-sicherung-'+lokalDT(new Date()).slice(0,10)+'.json';const f=new File([JSON.stringify(d,null,1)],name,{type:'application/json'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'GLUT Sicherung'});return}catch(e){if(e.name==='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function einlesen(file){let d;try{d=JSON.parse(await file.text())}catch(e){return toast('Datei nicht lesbar')}
 if(!d||d.app!=='glut'||!Array.isArray(d.rezepte)||!d.rezepte.length)return toast('Das ist keine GLUT-Sicherung');
 const neu=d.rezepte.map(norm),kn=Array.isArray(d.koch)?d.koch.map(normK):null;
 if(!await fragen('Sicherung einlesen?',neu.length+' Pizza-Rezepte'+(kn?' und '+kn.length+' Kochrezepte':'')+' einlesen. Deine aktuellen Rezepte werden ersetzt.',{ok:'Einlesen'}))return;
 try{localStorage.setItem(KEY+'.vorimport',JSON.stringify(S))}catch(e){}
 if(kn){try{localStorage.setItem(KKEY+'.vorimport',JSON.stringify(K))}catch(e){}K={v:KV,rezepte:kn,kats:katsAus(d.kats,kn),links:K.links};sichernK()}
 S.rezepte=neu;S.aktiv=neu.some(r=>r.id===d.aktiv)?d.aktiv:neu[0].id;S.entwurf=norm(S.rezepte.find(r=>r.id===S.aktiv));sichern();render();toast(neu.length+(kn?' + '+kn.length:'')+' Rezepte eingelesen')}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&AKT[b.dataset.act])AKT[b.dataset.act](b)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input:not([type=file]),select'))e.target.blur()});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.matches('input[data-f]')){const f=t.dataset.f,v=parse(t.value);if(isFinite(v)){if(GS[f])setzeG(f,v);else setze(f,klemme(f,v))}t.value=anz(f)}
 else if(t.id==='hefeIn'){const v=parse(t.value);ui.hefeEdit=false;if(isFinite(v)){const e=S.entwurf,g=rechnen(e).gesamt;if(g>v)e.hefeManuell=Math.min(5,Math.max(0,100*v*(1+(e.hydration+e.salz)/100)/(g-v)));sichern()}patchRechner()}
 else if(t.id==='schrIn'){S.entwurf.schritte=t.value;sichern();dirtyDot()}
 else if(t.id==='recSel'){if(!await wechsle(t.value))t.value=S.aktiv;else render()}
 else if(t.id==='zSel'){if(!await wechsle(t.value))t.value=S.aktiv;else $('#tl').innerHTML=tlHtml()}
 else if(t.id==='bz'){if(t.value){S.backzeit=t.value;sichern();$('#tl').innerHTML=tlHtml()}}
 else if(t.id==='imp'){if(t.files[0])einlesen(t.files[0]);t.value=''}
 else if(t.id==='kFile'){const fl=t.files[0];t.value='';if(fl&&ui.kform)try{ui.kform.bild=await verkleinern(fl);$('#kPrev').innerHTML=prevHtml()}catch(x){toast('Bild nicht lesbar')}}
 else if(t.id==='kKat'){if(t.value)ui.kform.kat=t.value;else{const n=await fragen('Neue Kategorie','Name der Kategorie',{eingabe:'',ok:'Hinzufügen'}),k=n?String(n).trim().slice(0,30):'';
  if(k){const ex=alleKats().find(x=>x.toLowerCase()===k.toLowerCase());if(ex)ui.kform.kat=ex;else{K.kats.push(k);sichernK();ui.kform.kat=k}}t.innerHTML=katOpts()}}});
window.addEventListener('hashchange',render);

S=laden();K=ladenK();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
